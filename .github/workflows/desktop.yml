# LazySpec for Claude (desktop/): on every push and pull request, typecheck, test, and check that the committed
# desktop/dist/server.js (what the Claude Code plugin runs) is built from the sources. On a tag v*: the Claude
# Desktop extension lazyspec.mcpb and the VS Code extension lazyspec.vsix as a GitHub release.
name: LazySpec for Claude

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm ci --prefix vscode
          npm install --prefix desktop --no-audit --no-fund

      - name: Typecheck
        run: npx --prefix desktop tsc -p desktop

      - name: Build and test
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          npm test --prefix desktop

      - name: dist/server.js is up to date
        run: git diff --exit-code -- desktop/dist .claude-plugin || (echo "::error::Run 'npm run build --prefix desktop' and commit desktop/dist and .claude-plugin" && exit 1)

      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || (echo "::error::tag ${GITHUB_REF_NAME} but desktop/package.json is $v" && exit 1)

      # The Netmedia tools (run_tool) are copied from AIToolbelt's develop into the extension (desktop/build.js).
      - name: Pack the Claude Desktop extension
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.AITOOLBELT_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            git clone --depth 1 --branch develop "https://x-access-token:${GH_TOKEN}@github.com/netmedia/aitoolbelt.git" ../AIToolbelt
          else
            echo "::warning::No AITOOLBELT_TOKEN secret: the extension is packed without the Netmedia tools"
          fi
          npm run pack --prefix desktop

      - name: Package the VS Code extension
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package --prefix vscode

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" desktop/lazyspec.mcpb vscode/lazyspec.vsix \
            --title "LazySpec ${GITHUB_REF_NAME}" --generate-notes

      # The organization's plugin marketplace (AIToolbelt) syncs only on its own pushes: the release reaches the
      # organization by pinning the lazyspec entry to this tag's commit, in a pull request that merges by itself
      # when AIToolbelt's checks pass. AITOOLBELT_TOKEN: a fine-grained token for netmedia/aitoolbelt with
      # Contents and Pull requests read and write (repository secret of netmedia/lazyspec).
      - name: Pin the release in the netmedia marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.AITOOLBELT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::No AITOOLBELT_TOKEN secret: pin ${GITHUB_SHA} in AIToolbelt's marketplace.json by hand (desktop/scripts/pin-marketplace.js)"; exit 0; fi
          v=$(node -p "require('./desktop/package.json').version")
          branch="lazyspec-v$v"
          git clone --depth 1 --branch develop "https://x-access-token:${GH_TOKEN}@github.com/netmedia/aitoolbelt.git" aitoolbelt
          node desktop/scripts/pin-marketplace.js aitoolbelt/.claude-plugin/marketplace.json "$GITHUB_SHA" "$v"
          cd aitoolbelt
          git switch -c "$branch"
          git add .claude-plugin/marketplace.json
          git -c user.name="lazyspec-release" -c user.email="netmedia@netmedia.hr" commit -m "chore: lazyspec $v in the netmedia marketplace"
          git push -u origin "$branch"
          gh pr create --repo netmedia/aitoolbelt --base develop --head "$branch" \
            --title "chore: lazyspec $v in the netmedia marketplace" \
            --body "Pins the \`lazyspec\` plugin to [${GITHUB_REF_NAME}](https://github.com/netmedia/lazyspec/releases/tag/${GITHUB_REF_NAME}) (\`${GITHUB_SHA}\`). Merging it syncs the organization's marketplace. The Claude Desktop extension \`lazyspec.mcpb\` from the release is uploaded separately (Organization settings > Connectors > Desktop > Upload new version)."
          gh pr merge --repo netmedia/aitoolbelt "$branch" --auto --merge || echo "::notice::Auto-merge is off in AIToolbelt: merge the pull request by hand"
