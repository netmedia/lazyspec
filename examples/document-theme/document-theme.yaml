# LazySpec document theme: the look of every document LazySpec makes (PDF, Word, HTML).
#
# In the project's openspec/config.yaml (the path relative to the project's root; spaces are fine):
#   lazyspec:
#     documentTheme: openspec/artifacts/document-theme.yaml
# or for one export: lazyspec -Export Pdf -Theme <path>   (relative to the current folder; wins)
#
# Next to this file:
#   fonts/    the fonts' .ttf (or .otf) files: PDF and HTML use them without installing them, Word gets them
#             embedded. LazySpec reads each file's family and style (regular, bold, italic, bold italic);
#             name the family below as the font calls itself (Montserrat-Regular.ttf, -Bold, -Italic,
#             -BoldItalic: "Montserrat"). A font not in fonts/ must be installed (Georgia, Consolas ...).
#   images/   the logos (.png, .jpg, .gif), relative to this file.
#
# Lengths: mm, cm, pt, in (a bare number: mm; font sizes: pt). Colours: "#RRGGBB" (quoted) or a name from colors.

page:
  size: A4                                   # A4, A5, Letter, Legal, or "210mm 297mm"
  margins: { top: 40mm, right: 27mm, bottom: 25mm, left: 25mm }   # or "40mm 27mm 25mm 25mm"

colors:
  text: "#333333"
  accent: "#FF565F"
  muted: "#666666"
  link: "#0563C1"

# The styles: font, size, bold, italic, underline, color, background, spaceBefore, spaceAfter, lineHeight,
# align (left, center, right, justify), pageBreakBefore. Every style takes body's font unless it sets its own.
# In Word they are the built-in styles: body = Normal, title = Title, subtitle = Subtitle, heading1..6 =
# Heading 1..6, tocHeading = TOC Heading, table = Table Grid, link = Hyperlink.
styles:
  body:       { font: Montserrat, size: 10pt, color: text, lineHeight: 1.3 }
  title:      { size: 34pt, bold: true, color: text }
  subtitle:   { size: 22pt, italic: true, color: muted }
  heading1:   { size: 18pt, bold: false, color: accent }        # a chapter (a page of its own)
  heading2:   { size: 13pt, bold: false, underline: true }      # a capability, a section (Why, Purpose ...)
  heading3:   { size: 11pt, bold: true }
  heading4:   { size: 10.5pt, bold: true }                      # a requirement
  heading5:   { size: 10pt, bold: true }                        # a scenario
  tocHeading: { size: 16pt, bold: false, color: accent }        # "Contents"
  table:      { size: 9pt, borderColor: "#BFBFBF", headerBackground: "#F2F2F2" }
  link:       { color: link, underline: true }
  code:       { font: Consolas, size: 8.5pt }

# Header and footer: left, center, right: a text ({title} {subtitle} {client} {date} {page} {pages}) or
# logo; logo: the picture, logoHeight its height; size, color: the texts'; firstPage: on the cover too (false).
header: { left: logo, logo: images/logo.png, logoHeight: 9mm }
footer: { left: "{title}", right: "{page} / {pages}", size: 8pt, color: muted }

# The cover: a logo above the title.
cover:  { logo: images/logo.png, logoHeight: 16mm }
